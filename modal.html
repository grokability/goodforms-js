<div id="goodforms-modal" aria-hidden="true" class="goodforms_modal modal micromodal-slide">
    <div tabindex="-1" data-micromodal-close class="goodforms_modal modal__overlay">
        <div role="dialog" aria-modal="true" aria-labelledby="modal-1-title" class="goodforms_modal modal__container">
            <header class="modal__header">
                <button aria-label="Close this dialog window" data-micromodal-close class="goodforms_modal modal__close"></button>
            </header>
            <div id="modal-1-content" class="goodforms_modal modal__content">
                <span id="goodforms_message"></span>To verify your email address, we need to send you an email. If you agree, re-type your email here:
                <input type="text" id="goodforms_challenge_address">
            </div>
            <footer class="modal__footer goodforms_modal">
                <button class="modal__btn modal__btn-primary goodforms_modal" id="goodforms-continue-button">Continue</button>
                <button class="modal__btn goodforms_modal" data-micromodal-close aria-label="Close this dialog window">Close</button>
            </footer>
        </div>
    </div>
    <!-- to view this with styling, do this: -->
    <!--<style src="./micromodal.css"></style>-->
    <!-- above the first <div> -->
</div>
